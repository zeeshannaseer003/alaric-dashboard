<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alaric — Provider Support Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0a0c;--fg:#f4f4f5;--card:#141417;--border:#27272a;--muted:#a1a1aa;--muted-2:#71717a;--ok:#22c55e;--ok-bg:rgba(34,197,94,.12);--warn:#f59e0b;--warn-bg:rgba(245,158,11,.12);--bad:#ef4444;--bad-bg:rgba(239,68,68,.12);--side:#09090b;--r:14px;--p:#14b8a6;--p-hover:#0d9488;--shadow:0 4px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at top,#141417 0%,var(--bg) 60%)}
.auth-box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px;box-shadow:var(--shadow)}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.auth-logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#14b8a6,#0d9488);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff}
.auth-logo span{font-size:1.5rem;font-weight:700}
.auth-sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:28px}
.auth-tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:24px;border:1px solid var(--border)}
.auth-tabs button{flex:1;background:none;border:0;color:var(--muted);font:500 14px inherit;padding:10px;border-radius:9px;cursor:pointer}
.auth-tabs button.on{background:var(--p);color:#fff}
.auth-field{margin-bottom:16px}.auth-field label{display:block;color:var(--muted);font-size:.8rem;font-weight:500;margin-bottom:6px}
.auth-field input,.auth-field select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--fg);padding:12px 14px;font:inherit}
.auth-field input:focus,.auth-field select:focus,textarea:focus{outline:none;border-color:var(--p)}
.pw-wrap{position:relative}.pw-wrap input{padding-right:44px}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600}
.auth-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.auth-btn{width:100%;background:var(--p);color:#fff;border:0;border-radius:11px;padding:13px;font:600 15px inherit;cursor:pointer;margin-top:8px}
.auth-btn:hover{background:var(--p-hover)}.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-btn.o{background:transparent;border:1px solid var(--border);color:var(--fg);margin-top:10px}
.auth-error,.auth-success{border-radius:10px;padding:11px 14px;font-size:.85rem;margin-bottom:16px;display:none}
.auth-error{background:var(--bad-bg);border:1px solid rgba(239,68,68,.3);color:var(--bad)}.auth-error.show{display:block}
.auth-success{background:var(--ok-bg);border:1px solid rgba(34,197,94,.3);color:var(--ok)}.auth-success.show{display:block}
.pw-strength{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.pw-strength-bar{height:100%;width:0;border-radius:2px;transition:width .3s,background .3s}
.pw-hint{font-size:.75rem;color:var(--muted-2);margin-top:6px}
.auth-links{text-align:right;margin:-6px 0 12px}.auth-links button.link{background:none;border:0;color:var(--p);font:500 13px inherit;cursor:pointer}
.real-badge{text-align:center;font-size:.75rem;color:var(--ok);margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.app{display:none;min-height:100vh}.app.show{display:flex}
.side{width:260px;background:var(--side);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
.logo{font-size:1.4rem;font-weight:700;padding:4px 12px 16px;display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--p),#0d9488);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700}
.user-info{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.85rem;display:flex;align-items:center;gap:12px}
.user-info .av{width:40px;height:40px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex-shrink:0;overflow:hidden}
.user-info .av img{width:100%;height:100%;object-fit:cover}
.user-info .name{font-weight:600}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:11px;color:var(--muted);background:none;border:0;font:500 13.5px inherit;text-align:left;cursor:pointer;width:100%}
.nav:hover{background:var(--card);color:#fff}.nav.on{background:var(--p);color:#fff}
.nav .badge{margin-left:auto;background:rgba(255,255,255,.2);font-size:11px;padding:2px 7px;border-radius:99px}
.logout-btn{margin-top:auto;padding:12px 14px;border-radius:11px;background:none;border:1px solid var(--border);color:var(--muted);font:500 13px inherit;cursor:pointer;text-align:left}
.logout-btn:hover{background:var(--bad-bg);color:var(--bad)}
.main{flex:1;padding:36px 40px;min-width:0;max-width:1120px}
h1{font-size:1.75rem;font-weight:700;margin-bottom:4px}.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stats .card{margin:0;padding:18px}.stat .l{color:var(--muted);font-size:.78rem;margin-bottom:8px;text-transform:uppercase}.stat .v{font-size:1.6rem;font-weight:700}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:500 14px inherit;cursor:pointer}.btn:hover{background:var(--p-hover)}.btn.o{background:transparent;border:1px solid var(--border);color:var(--fg)}.btn.s{padding:7px 12px;font-size:.82rem}.btn.d{background:var(--bad-bg);color:var(--bad)}.btn.ok{background:var(--ok-bg);color:var(--ok)}
.pill{display:inline-flex;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:500;background:#27272a;color:var(--muted)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.badge-role{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.badge-role.admin{background:rgba(249,115,22,.15);color:#fb923c}
.badge-role.official{background:rgba(99,102,241,.15);color:#a5b4fc}
.badge-role.verified{background:var(--ok-bg);color:var(--ok)}
.badge-role.pending{background:var(--warn-bg);color:var(--warn)}
.badge-role.member{background:#27272a;color:var(--muted)}
.profile-photo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--border);margin-bottom:12px}
.profile-photo-ph{width:96px;height:96px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#fff;margin-bottom:12px}
.photo-btn{display:inline-block;cursor:pointer;color:var(--p);font-size:.85rem;font-weight:500;margin-bottom:16px}
.photo-btn input{display:none}
.post-title{font-weight:600;font-size:1.05rem;margin-bottom:6px}
.post-meta{font-size:.8rem;color:var(--muted);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.post-body{color:#e4e4e7;line-height:1.6;margin-bottom:14px;white-space:pre-wrap}
.post-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.comment{border-left:3px solid var(--p);padding:8px 0 8px 14px;margin:10px 0}
.comment .who{font-size:.8rem;color:var(--muted);margin-bottom:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.bar input{margin:0;flex:1;min-width:120px}
.priv{display:flex;gap:12px;background:var(--warn-bg);border:1px solid rgba(245,158,11,.25);border-radius:var(--r);padding:14px 18px;font-size:.85rem;color:#fbbf24;margin-top:28px}
.toast{position:fixed;bottom:28px;right:28px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;font-size:.9rem;font-weight:500;box-shadow:var(--shadow);z-index:1000;max-width:340px}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border)}th{color:var(--muted);font-size:.75rem;text-transform:uppercase}
.empty{text-align:center;padding:40px;color:var(--muted)}
.chat-box{max-height:360px;overflow-y:auto;margin-bottom:12px}
.chat-msg{padding:10px 14px;background:var(--bg);border-radius:10px;margin-bottom:8px}
.chat-msg .who{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.vis-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}.vis-row label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--fg);font-size:.88rem;margin:0}
.pending-banner{background:var(--warn-bg);border:1px solid rgba(245,158,11,.3);color:#fbbf24;border-radius:var(--r);padding:14px 16px;margin-bottom:20px;font-size:.9rem}
.search-bar{width:100%;max-width:360px;margin-bottom:16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--fg);padding:12px 14px;font:inherit}
@media(max-width:768px){.app.show{flex-direction:column}.side{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:12px;gap:6px;border-right:0;border-bottom:1px solid var(--border)}.logo,.user-info{display:none}.nav{width:auto;padding:9px 12px;font-size:13px}.logout-btn{display:none}.main{padding:20px 16px}.auth-row{grid-template-columns:1fr}h1{font-size:1.4rem}}
</style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="auth-logo"><div class="auth-logo-icon">A</div><span>Alaric</span></div>
    <p class="auth-sub">Provider Support Platform</p>
    <div class="auth-tabs" id="authTabs">
      <button class="on" data-tab="login">Login</button>
      <button data-tab="signup">Create Account</button>
    </div>
    <div class="auth-error" id="authError"></div>
    <div class="auth-success" id="authSuccess"></div>
    <div id="loginForm">
      <div class="auth-field"><label>Email</label><input type="email" id="loginId" placeholder="you@example.com" autocomplete="email"></div>
      <div class="auth-field"><label>Password</label>
        <div class="pw-wrap"><input type="password" id="loginPw" placeholder="Enter password" autocomplete="current-password"><button type="button" class="pw-toggle" data-target="loginPw">Show</button></div>
      </div>
      <div class="auth-links"><button type="button" class="link" id="forgotLink">Forgot password?</button></div>
      <button class="auth-btn" id="loginBtn">Login</button>
    </div>
    <div id="forgotForm" style="display:none">
      <p class="auth-sub" style="margin-bottom:16px;text-align:left">Enter your account email for a reset link.</p>
      <div class="auth-field"><label>Email</label><input type="email" id="fpId" placeholder="you@example.com"></div>
      <button class="auth-btn" id="resetBtn">Send Reset Link</button>
      <button class="auth-btn o" id="backToLogin">Back to Login</button>
    </div>
    <div id="signupForm" style="display:none">
      <div class="auth-row">
        <div class="auth-field"><label>First Name</label><input type="text" id="suFirst" placeholder="First name"></div>
        <div class="auth-field"><label>Last Name</label><input type="text" id="suLast" placeholder="Last name"></div>
      </div>
      <div class="auth-field"><label>Email</label><input type="email" id="suId" placeholder="you@example.com" autocomplete="email"></div>
      <div class="auth-field"><label>Password</label>
        <div class="pw-wrap"><input type="password" id="suPw" placeholder="Strong password" autocomplete="new-password"><button type="button" class="pw-toggle" data-target="suPw">Show</button></div>
        <div class="pw-strength"><div class="pw-strength-bar" id="pwBar"></div></div>
        <div class="pw-hint" id="pwHint">Min 8 chars, number &amp; symbol</div>
      </div>
      <div class="auth-field"><label>Medical Specialty</label>
        <select id="suSpec">
          <option value="">Select specialty</option>
          <option>Cardiology</option><option>Internal Medicine</option><option>Mental Health / Psychiatry</option>
          <option>Family Medicine</option><option>Emergency Medicine</option><option>Pediatrics</option>
          <option>Dermatology</option><option>Orthopedic Surgery</option><option>Neurology</option>
          <option>Obstetrics and Gynecology</option><option>Oncology</option><option>Radiology</option>
          <option>Anesthesiology</option><option>General Surgery</option><option>Medical Coding / Billing</option><option>Other</option>
        </select>
      </div>
      <button class="auth-btn" id="signupBtn">Create Account</button>
    </div>
    <div class="real-badge">🔒 Real accounts · Powered by Supabase</div>
  </div>
</div>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main class="main"><div id="c"></div>
    <div class="priv"><span>🔒</span><div><b>Privacy:</b> Personal info (email, full account) is admin-only. Members never see others’ private data.</div></div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
