<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alaric — Provider Support Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0a0c;--fg:#f4f4f5;--card:#141417;--card-hover:#1a1a1f;--border:#27272a;--border-light:#3f3f46;--muted:#a1a1aa;--muted-2:#71717a;--ok:#22c55e;--ok-bg:rgba(34,197,94,.12);--warn:#f59e0b;--warn-bg:rgba(245,158,11,.12);--bad:#ef4444;--bad-bg:rgba(239,68,68,.12);--info:#818cf8;--info-bg:rgba(99,102,241,.12);--side:#09090b;--r:14px;--p:#14b8a6;--p-hover:#0d9488;--shadow:0 4px 24px rgba(0,0,0,.25);--transition:.2s cubic-bezier(.4,0,.2,1)}
html[data-role=staff]{--p:#6366f1;--p-hover:#4f46e5}html[data-role=admin]{--p:#f97316;--p-hover:#ea580c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at top,#141417 0%,var(--bg) 60%)}
.auth-box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px;box-shadow:var(--shadow);animation:fadeIn .35s ease}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.auth-logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#14b8a6,#0d9488);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff}
.auth-logo span{font-size:1.5rem;font-weight:700;letter-spacing:-.03em}
.auth-sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:28px}
.auth-tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:24px;border:1px solid var(--border)}
.auth-tabs button{flex:1;background:none;border:0;color:var(--muted);font:500 14px inherit;padding:10px;border-radius:9px;cursor:pointer;transition:all var(--transition)}
.auth-tabs button.on{background:var(--p);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.auth-field{margin-bottom:16px}.auth-field label{display:block;color:var(--muted);font-size:.8rem;font-weight:500;margin-bottom:6px}
.auth-field input,.auth-field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--fg);padding:12px 14px;font:inherit}
.auth-field input:focus,.auth-field select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(20,184,166,.15)}
.pw-wrap{position:relative}.pw-wrap input{padding-right:44px;margin-bottom:0}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;padding:4px 6px}.pw-toggle:hover{color:var(--fg)}
.auth-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.auth-btn{width:100%;background:var(--p);color:#fff;border:0;border-radius:11px;padding:13px;font:600 15px inherit;cursor:pointer;margin-top:8px}
.auth-btn:hover{background:var(--p-hover)}.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-btn.o{background:transparent;border:1px solid var(--border);color:var(--fg);margin-top:10px}
.auth-error,.auth-success{border-radius:10px;padding:11px 14px;font-size:.85rem;margin-bottom:16px;display:none}
.auth-error{background:var(--bad-bg);border:1px solid rgba(239,68,68,.3);color:var(--bad)}.auth-error.show{display:block}
.auth-success{background:var(--ok-bg);border:1px solid rgba(34,197,94,.3);color:var(--ok)}.auth-success.show{display:block}
.pw-strength{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.pw-strength-bar{height:100%;width:0;border-radius:2px;transition:width .3s,background .3s}
.pw-hint{font-size:.75rem;color:var(--muted-2);margin-top:6px}
.auth-links{text-align:right;margin:-6px 0 12px}.auth-links button.link{background:none;border:0;color:var(--p);font:500 13px inherit;cursor:pointer;padding:0}.auth-links button.link:hover{text-decoration:underline}
.real-badge{text-align:center;font-size:.75rem;color:var(--ok);margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.app{display:none;min-height:100vh}.app.show{display:flex}
.side{width:260px;background:var(--side);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
.logo{font-size:1.4rem;font-weight:700;padding:4px 12px 16px;display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--p),#0d9488);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700}
.user-info{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.85rem;display:flex;align-items:center;gap:12px}
.user-info .avatar-placeholder{width:40px;height:40px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff}
.user-info .name{font-weight:600}.user-info .role-tag{color:var(--muted);font-size:.75rem;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:11px;color:var(--muted);background:none;border:0;font:500 13.5px inherit;text-align:left;cursor:pointer}
.nav:hover{background:var(--card);color:#fff}.nav.on{background:var(--p);color:#fff}
.logout-btn{margin-top:auto;padding:12px 14px;border-radius:11px;background:none;border:1px solid var(--border);color:var(--muted);font:500 13px inherit;cursor:pointer;text-align:left}
.logout-btn:hover{background:var(--bad-bg);color:var(--bad)}
.main{flex:1;padding:36px 40px;min-width:0;max-width:1120px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:1.75rem;font-weight:700;margin-bottom:4px}h2{font-size:1.05rem;font-weight:600;margin-bottom:14px}.sub{color:var(--muted);margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.stats .card{margin:0;padding:20px}.stat .l{color:var(--muted);font-size:.82rem;margin-bottom:10px;text-transform:uppercase}.stat .v{font-size:1.85rem;font-weight:700}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:500 14px inherit;cursor:pointer}.btn:hover{background:var(--p-hover)}
.priv{display:flex;gap:14px;background:var(--warn-bg);border:1px solid rgba(245,158,11,.25);border-radius:var(--r);padding:16px 20px;font-size:.88rem;color:#fbbf24;margin-top:32px}.priv b{color:#fcd34d}
.toast{position:fixed;bottom:28px;right:28px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;font-size:.9rem;font-weight:500;box-shadow:var(--shadow);z-index:1000;animation:slideUp .3s ease;max-width:340px}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){.app.show{flex-direction:column}.side{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;overflow-x:auto;padding:12px 14px;align-items:center;gap:6px;border-right:0;border-bottom:1px solid var(--border)}.logo,.user-info{display:none}.nav{flex-shrink:0;white-space:nowrap;padding:9px 14px;font-size:13px}.logout-btn{display:none}.main{padding:24px 18px}.stats{grid-template-columns:1fr 1fr}h1{font-size:1.45rem}.toast{left:16px;right:16px;bottom:16px;max-width:none}.auth-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="auth-logo"><div class="auth-logo-icon">A</div><span>Alaric</span></div>
    <p class="auth-sub">Provider Support Platform</p>
    <div class="auth-tabs" id="authTabs">
      <button class="on" data-tab="login">Login</button>
      <button data-tab="signup">Create Account</button>
    </div>
    <div class="auth-error" id="authError"></div>
    <div class="auth-success" id="authSuccess"></div>

    <div id="loginForm">
      <div class="auth-field"><label>Email</label><input type="email" id="loginId" placeholder="you@example.com" autocomplete="email"></div>
      <div class="auth-field"><label>Password</label>
        <div class="pw-wrap"><input type="password" id="loginPw" placeholder="Enter password" autocomplete="current-password"><button type="button" class="pw-toggle" data-target="loginPw">Show</button></div>
      </div>
      <div class="auth-links"><button type="button" class="link" id="forgotLink">Forgot password?</button></div>
      <button class="auth-btn" id="loginBtn">Login</button>
    </div>

    <div id="forgotForm" style="display:none">
      <p class="auth-sub" style="margin-bottom:16px;text-align:left">Enter your account email. We will send a password reset link.</p>
      <div class="auth-field"><label>Email</label><input type="email" id="fpId" placeholder="you@example.com"></div>
      <button class="auth-btn" id="resetBtn">Send Reset Link</button>
      <button class="auth-btn o" id="backToLogin">Back to Login</button>
    </div>

    <div id="signupForm" style="display:none">
      <div class="auth-row">
        <div class="auth-field"><label>First Name</label><input type="text" id="suFirst" placeholder="First name"></div>
        <div class="auth-field"><label>Last Name</label><input type="text" id="suLast" placeholder="Last name"></div>
      </div>
      <div class="auth-field"><label>Email</label><input type="email" id="suId" placeholder="you@example.com" autocomplete="email"></div>
      <div class="auth-field"><label>Password</label>
        <div class="pw-wrap"><input type="password" id="suPw" placeholder="Create strong password" autocomplete="new-password"><button type="button" class="pw-toggle" data-target="suPw">Show</button></div>
        <div class="pw-strength"><div class="pw-strength-bar" id="pwBar"></div></div>
        <div class="pw-hint" id="pwHint">Min 8 chars, include number & symbol</div>
      </div>
      <div class="auth-field"><label>Medical Specialty</label>
        <select id="suSpec">
          <option value="">Select specialty</option>
          <option>Allergy and Immunology</option><option>Anesthesiology</option><option>Cardiology</option>
          <option>Cardiothoracic Surgery</option><option>Critical Care Medicine</option><option>Dermatology</option>
          <option>Emergency Medicine</option><option>Endocrinology</option><option>Family Medicine</option>
          <option>Gastroenterology</option><option>General Surgery</option><option>Geriatrics</option>
          <option>Hematology</option><option>Infectious Disease</option><option>Internal Medicine</option>
          <option>Medical Coding / Billing</option><option>Mental Health / Psychiatry</option><option>Nephrology</option>
          <option>Neurology</option><option>Neurosurgery</option><option>Obstetrics and Gynecology</option>
          <option>Oncology</option><option>Ophthalmology</option><option>Orthopedic Surgery</option>
          <option>Otolaryngology (ENT)</option><option>Pathology</option><option>Pediatrics</option>
          <option>Physical Medicine and Rehabilitation</option><option>Plastic Surgery</option>
          <option>Preventive Medicine</option><option>Pulmonology</option><option>Radiology</option>
          <option>Rheumatology</option><option>Urology</option><option>Vascular Surgery</option><option>Other</option>
        </select>
      </div>
      <button class="auth-btn" id="signupBtn">Create Account</button>
    </div>

    <div class="real-badge">🔒 Real accounts · Powered by Supabase</div>
  </div>
</div>

<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div id="c"></div>
    <div class="priv"><span>🔒</span><div><b>Privacy:</b> Your account is stored securely. Admin tools are admin-only.</div></div>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://kucenxfhkiqfxqrytbye.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_alyK2HPCzMysVlSaHgKmrg_KBBnp_6K';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function isStrongPassword(pw){return pw.length>=8&&/[0-9]/.test(pw)&&/[^A-Za-z0-9]/.test(pw)}
function updatePwStrength(pw){
  var bar=document.getElementById('pwBar'),hint=document.getElementById('pwHint');
  if(!bar)return;var s=0;if(pw.length>=8)s++;if(/[0-9]/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;if(/[A-Z]/.test(pw)&&/[a-z]/.test(pw))s++;
  bar.style.width=(s/4*100)+'%';bar.style.background=s<2?'#ef4444':s<3?'#f59e0b':'#22c55e';
  if(hint)hint.textContent=s<2?'Weak — add number & symbol':s<3?'Medium — almost there':'Strong password';
}
function showAuthError(msg){var e=document.getElementById('authError');e.textContent=msg;e.classList.add('show');document.getElementById('authSuccess').classList.remove('show')}
function showAuthSuccess(msg){var e=document.getElementById('authSuccess');e.textContent=msg;e.classList.add('show');document.getElementById('authError').classList.remove('show')}
function hideAuthMsg(){document.getElementById('authError').classList.remove('show');document.getElementById('authSuccess').classList.remove('show')}
function toast(msg){var e=document.querySelector('.toast');if(e)e.remove();var el=document.createElement('div');el.className='toast';el.textContent='✓ '+msg;document.body.appendChild(el);setTimeout(function(){el.remove()},2800)}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&','<':'<','>':'>','"':'"'}[c]})}

function showAuthPanel(mode){
  document.getElementById('loginForm').style.display=mode==='login'?'':'none';
  document.getElementById('signupForm').style.display=mode==='signup'?'':'none';
  document.getElementById('forgotForm').style.display=mode==='forgot'?'':'none';
  document.getElementById('authTabs').style.display=mode==='forgot'?'none':'';
  document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('on',b.dataset.tab===mode)});
  hideAuthMsg();
}
document.querySelectorAll('[data-tab]').forEach(function(btn){btn.addEventListener('click',function(){showAuthPanel(btn.dataset.tab)})});
document.getElementById('suPw').addEventListener('input',function(){updatePwStrength(this.value)});
document.querySelectorAll('.pw-toggle').forEach(function(btn){
  btn.addEventListener('click',function(){
    var inp=document.getElementById(btn.getAttribute('data-target'));if(!inp)return;
    if(inp.type==='password'){inp.type='text';btn.textContent='Hide'}else{inp.type='password';btn.textContent='Show'}
  });
});
document.getElementById('forgotLink').addEventListener('click',function(){showAuthPanel('forgot')});
document.getElementById('backToLogin').addEventListener('click',function(){showAuthPanel('login')});

document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('loginPw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
document.getElementById('signupBtn').addEventListener('click',doSignup);
document.getElementById('resetBtn').addEventListener('click',doForgot);

async function doLogin(){
  hideAuthMsg();
  var email=document.getElementById('loginId').value.trim();
  var pw=document.getElementById('loginPw').value;
  if(!email||!pw){showAuthError('Enter email and password.');return}
  var btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Signing in...';
  try{
    var res=await sb.auth.signInWithPassword({email:email,password:pw});
    if(res.error){showAuthError(res.error.message);return}
    await enterApp(res.data.user);
  }catch(err){showAuthError(err.message||'Login failed')}
  finally{btn.disabled=false;btn.textContent='Login'}
}

async function doSignup(){
  hideAuthMsg();
  var first=document.getElementById('suFirst').value.trim();
  var last=document.getElementById('suLast').value.trim();
  var email=document.getElementById('suId').value.trim();
  var pw=document.getElementById('suPw').value;
  var spec=document.getElementById('suSpec').value;
  if(!first||!last){showAuthError('First and last name required.');return}
  if(!email){showAuthError('Email required.');return}
  if(!isStrongPassword(pw)){showAuthError('Password must be 8+ chars with number & symbol.');return}
  if(!spec){showAuthError('Select a specialty.');return}
  var btn=document.getElementById('signupBtn');btn.disabled=true;btn.textContent='Creating...';
  try{
    var res=await sb.auth.signUp({
      email:email,
      password:pw,
      options:{data:{first_name:first,last_name:last,specialty:spec,role:'member'}}
    });
    if(res.error){showAuthError(res.error.message);return}
    if(res.data.user&&res.data.session){
      showAuthSuccess('Account created!');
      setTimeout(function(){enterApp(res.data.user)},600);
    }else{
      showAuthSuccess('Account created. Check your email to confirm, then login.');
      setTimeout(function(){showAuthPanel('login')},1500);
    }
  }catch(err){showAuthError(err.message||'Signup failed')}
  finally{btn.disabled=false;btn.textContent='Create Account'}
}

async function doForgot(){
  hideAuthMsg();
  var email=document.getElementById('fpId').value.trim();
  if(!email){showAuthError('Enter your email.');return}
  var btn=document.getElementById('resetBtn');btn.disabled=true;btn.textContent='Sending...';
  try{
    var res=await sb.auth.resetPasswordForEmail(email,{
      redirectTo: window.location.origin + window.location.pathname
    });
    if(res.error){showAuthError(res.error.message);return}
    showAuthSuccess('Reset link sent. Check your email inbox (and spam).');
  }catch(err){showAuthError(err.message||'Could not send reset email')}
  finally{btn.disabled=false;btn.textContent='Send Reset Link'}
}

var currentUser=null,role='member',idx=0;

function userFromSession(user){
  var m=user.user_metadata||{};
  return {
    id:user.id,
    email:user.email,
    first:m.first_name||m.first||(user.email?user.email.split('@')[0]:'User'),
    last:m.last_name||m.last||'',
    specialty:m.specialty||'',
    role:m.role||'member'
  };
}

async function enterApp(user){
  currentUser=userFromSession(user);
  role=currentUser.role||'member';
  idx=0;
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').classList.add('show');
  render();
  toast('Welcome, '+currentUser.first+'!');
}

function render(){
  document.documentElement.setAttribute('data-role',role);
  var displayName=(currentUser.first+' '+currentUser.last).trim();
  var letter=(currentUser.first||'?')[0].toUpperCase();
  var secs=role==='admin'
    ?[['Overview',function(){return hd('Overview','Admin dashboard')+'<div class="stats"><div class="card stat"><div class="l">Signed in as</div><div class="v" style="font-size:1.1rem">'+esc(currentUser.email)+'</div></div><div class="card stat"><div class="l">Role</div><div class="v" style="font-size:1.1rem">Admin</div></div></div><div class="card"><p style="color:var(--muted);line-height:1.6">Real authentication is live via Supabase. Members who sign up appear in Auth → Users in your Supabase dashboard.</p></div>'}],['My Profile',profilePage]]
    :[['Home',function(){return hd('Welcome','You are signed in with a real account.')+'<div class="stats"><div class="card stat"><div class="l">Specialty</div><div class="v" style="font-size:1.15rem">'+esc(currentUser.specialty||'—')+'</div></div><div class="card stat"><div class="l">Email</div><div class="v" style="font-size:1rem">'+esc(currentUser.email)+'</div></div></div><div class="card"><p style="color:var(--muted);line-height:1.6">Your account is stored on the server. You can use Forgot password anytime — a reset email will be sent.</p></div>'}],['My Profile',profilePage]];

  var h='<div class="logo"><div class="logo-icon">A</div>Alaric</div>';
  h+='<div class="user-info"><div class="avatar-placeholder">'+letter+'</div><div><div class="name">'+esc(displayName)+'</div><div class="role-tag">'+esc(role)+(currentUser.specialty?' · '+esc(currentUser.specialty):'')+'</div></div></div>';
  secs.forEach(function(x,i){h+='<button class="nav'+(i===idx?' on':'')+'" data-i="'+i+'">'+x[0]+'</button>'});
  h+='<button class="logout-btn" id="logoutBtn">Logout</button>';
  document.getElementById('side').innerHTML=h;
  document.getElementById('c').innerHTML=secs[idx][1]();

  document.getElementById('logoutBtn').onclick=async function(){
    await sb.auth.signOut();
    currentUser=null;
    document.getElementById('app').classList.remove('show');
    document.getElementById('authScreen').style.display='';
    hideAuthMsg();
  };
  document.querySelectorAll('.nav[data-i]').forEach(function(btn){
    btn.onclick=function(){idx=+btn.dataset.i;render()};
  });
}

function hd(t,s){return '<h1>'+t+'</h1><p class="sub">'+s+'</p>'}
function profilePage(){
  return hd('My Profile','Account details from Supabase')+
    '<div class="card" style="max-width:480px">'+
    '<div class="auth-field"><label>Name</label><input value="'+esc(currentUser.first+' '+currentUser.last)+'" disabled style="opacity:.7"></div>'+
    '<div class="auth-field"><label>Email</label><input value="'+esc(currentUser.email)+'" disabled style="opacity:.7"></div>'+
    '<div class="auth-field"><label>Specialty</label><input value="'+esc(currentUser.specialty)+'" disabled style="opacity:.7"></div>'+
    '<div class="auth-field"><label>Role</label><input value="'+esc(role)+'" disabled style="opacity:.7"></div>'+
    '</div>';
}

(async function init(){
  var sess=await sb.auth.getSession();
  if(sess.data&&sess.data.session&&sess.data.session.user){
    await enterApp(sess.data.session.user);
  }
  sb.auth.onAuthStateChange(function(event,session){
    if(event==='SIGNED_OUT'){
      currentUser=null;
      document.getElementById('app').classList.remove('show');
      document.getElementById('authScreen').style.display='';
    }
  });
})();
</script>
</body>
</html>
