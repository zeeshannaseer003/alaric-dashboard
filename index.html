<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alaric — Health provider community</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#070B12;--fg:#F4F1EA;--card:#0F1724;--card-2:#121C2B;
  --border:rgba(212,175,55,.14);--muted:#8B9BB4;--muted-2:#6B7A94;
  --ok:#34d399;--ok-bg:rgba(52,211,153,.14);
  --warn:#E8C547;--warn-bg:rgba(232,197,71,.14);
  --bad:#fb7185;--bad-bg:rgba(251,113,133,.14);
  --side:#060A10;--r:16px;
  --p:#D4AF37;--p-2:#A68B2A;--p-hover:#E8C547;
  --teal:#2DD4BF;--teal-dim:var(--p-2);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --font:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.55;-webkit-tap-highlight-color:transparent}
body{background:
  radial-gradient(900px 420px at 12% -10%, rgba(212,175,55,.12), transparent 60%),
  radial-gradient(700px 380px at 100% 0%, rgba(45,212,191,.10), transparent 55%),
  var(--bg);}
button,input,select,textarea{font-family:inherit}
.auth-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.auth-box{width:100%;max-width:440px;background:linear-gradient(180deg,rgba(18,38,50,.92),rgba(8,18,24,.94));border:1px solid var(--border);border-radius:24px;padding:36px 30px 28px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.auth-logo-icon{width:44px;height:44px;background:linear-gradient(145deg,#E8C547,var(--p-2));border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#1a1408;box-shadow:0 8px 24px rgba(45,212,191,.25)}
.auth-logo span{font-size:1.55rem;font-weight:700;letter-spacing:-.03em}
.auth-sub{text-align:center;color:var(--muted);font-size:.92rem;margin-bottom:26px}
.auth-tabs{display:flex;background:rgba(0,0,0,.28);border-radius:14px;padding:4px;margin-bottom:22px;border:1px solid var(--border)}
.auth-tabs button{flex:1;background:none;border:0;color:var(--muted);font:600 14px inherit;padding:10px;border-radius:11px;cursor:pointer}
.auth-tabs button.on{background:linear-gradient(180deg,var(--p),var(--p-2));color:#1a1408}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;color:var(--muted);font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.auth-field input,.auth-field select,textarea,.search-bar,.bar input{
  width:100%;background:#07141b;border:1px solid var(--border);border-radius:12px;color:var(--fg);padding:12px 14px;font:inherit;font-size:16px}
.auth-field input:focus,.auth-field select:focus,textarea:focus,.search-bar:focus,.bar input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(45,212,191,.15)}
.pw-wrap{position:relative}.pw-wrap input{padding-right:64px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--p);cursor:pointer;font-size:13px;font-weight:700;padding:8px}
.auth-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.auth-btn,.btn{background:linear-gradient(180deg,var(--p),var(--p-2));color:#1a1408;border:0;border-radius:12px;padding:13px 18px;font:700 15px inherit;cursor:pointer}
.auth-btn{width:100%;margin-top:6px}
.auth-btn:hover,.btn:hover{filter:brightness(1.06)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-btn.o,.btn.o{background:transparent;border:1px solid var(--border);color:var(--fg);font-weight:600}
.btn.s{padding:8px 12px;font-size:.82rem;border-radius:10px}
.btn.d{background:var(--bad-bg);color:var(--bad)}
.btn.ok{background:var(--ok-bg);color:var(--ok)}
.auth-error,.auth-success{border-radius:12px;padding:11px 14px;font-size:.85rem;margin-bottom:14px;display:none}
.auth-error{background:var(--bad-bg);border:1px solid rgba(251,113,133,.3);color:#fecdd3}.auth-error.show{display:block}
.auth-success{background:var(--ok-bg);border:1px solid rgba(52,211,153,.3);color:#a7f3d0}.auth-success.show{display:block}
.pw-strength{height:4px;background:#12303a;border-radius:99px;margin-top:8px;overflow:hidden}
.pw-strength-bar{height:100%;width:0;border-radius:99px;transition:width .3s,background .3s}
.pw-hint{font-size:.75rem;color:var(--muted-2);margin-top:6px}
.auth-links{text-align:right;margin:-4px 0 10px}
.auth-links button.link{background:none;border:0;color:var(--p);font:600 13px inherit;cursor:pointer}
.real-badge{text-align:center;font-size:.75rem;color:#E8C547;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.app{display:none;min-height:100vh;min-height:100dvh}.app.show{display:flex}
.side{width:272px;background:linear-gradient(180deg,#07151c,#061016);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;flex-shrink:0}
.logo{font-size:1.25rem;font-weight:750;letter-spacing:-.03em;padding:6px 12px 18px;display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;background:linear-gradient(145deg,#E8C547,var(--p-2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#1a1408;font-weight:800}
.user-info{background:var(--card-2);border:1px solid var(--border);border-radius:16px;padding:12px;margin:0 4px 16px;font-size:.85rem;display:flex;align-items:center;gap:12px}
.user-info .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,var(--p),var(--p-2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#1a1408;flex-shrink:0;overflow:hidden}
.user-info .av img,.profile-photo{object-fit:cover}
.user-info .av img{width:100%;height:100%}
.user-info .name{font-weight:700}
.nav{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;color:var(--muted);background:none;border:0;font:600 13.5px inherit;text-align:left;cursor:pointer;width:100%}
.nav:hover{background:rgba(45,212,191,.08);color:#fff}
.nav.on{background:linear-gradient(180deg,rgba(45,212,191,.2),rgba(15,118,110,.28));color:#F4F1EA;box-shadow:inset 0 0 0 1px rgba(45,212,191,.25)}
.nav .badge{margin-left:auto;background:#f59e0b;color:#1c1917;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px}
.logout-btn{margin-top:auto;padding:12px 14px;border-radius:12px;background:none;border:1px solid var(--border);color:var(--muted);font:600 13px inherit;cursor:pointer;text-align:left}
.logout-btn:hover{background:var(--bad-bg);color:#fecdd3;border-color:transparent}
.main{flex:1;padding:36px 42px 48px;min-width:0;max-width:1180px}
h1{font-size:1.85rem;font-weight:750;letter-spacing:-.03em;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 22px;max-width:640px}
.card{background:linear-gradient(180deg,rgba(18,38,50,.85),rgba(10,24,32,.9));border:1px solid var(--border);border-radius:18px;padding:18px 18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.stats .card{margin:0}
.stat .l{color:var(--muted);font-size:.72rem;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat .v{font-size:1.7rem;font-weight:750;letter-spacing:-.03em;color:#F4F1EA}
.pill,.badge-role{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.pill{background:#16313a;color:var(--muted)}
.pill.ok,.badge-role.verified{background:var(--ok-bg);color:#5EEAD4}
.pill.warn,.badge-role.pending{background:var(--warn-bg);color:#fde68a}
.pill.bad{background:var(--bad-bg);color:#fecdd3}
.badge-role.admin{background:rgba(251,146,60,.16);color:#fdba74}
.badge-role.official{background:rgba(129,140,248,.16);color:#c7d2fe}
.badge-role.member{background:#16313a;color:var(--muted)}
.badge-role.premium{background:rgba(212,175,55,.18);color:#E8C547}
.badge-role.verified{background:rgba(45,212,191,.16);color:#5EEAD4}
