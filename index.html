<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alaric — Health provider community</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#071018;--fg:#eef6f4;--card:#0e1c24;--card-2:#122632;
  --border:rgba(148,196,186,.16);--muted:#9bb3ad;--muted-2:#6f8b84;
  --ok:#34d399;--ok-bg:rgba(52,211,153,.14);
  --warn:#fbbf24;--warn-bg:rgba(251,191,36,.14);
  --bad:#fb7185;--bad-bg:rgba(251,113,133,.14);
  --side:#061016;--r:16px;--p:#2dd4bf;--p-2:#0f766e;--p-hover:#14b8a6;
  --shadow:0 18px 50px rgba(0,0,0,.35);
  --font:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.55;-webkit-tap-highlight-color:transparent}
body{background:
  radial-gradient(900px 420px at 12% -10%, rgba(45,212,191,.18), transparent 60%),
  radial-gradient(700px 380px at 100% 0%, rgba(15,118,110,.22), transparent 55%),
  var(--bg);}
button,input,select,textarea{font-family:inherit}
.auth-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.auth-box{width:100%;max-width:440px;background:linear-gradient(180deg,rgba(18,38,50,.92),rgba(8,18,24,.94));border:1px solid var(--border);border-radius:24px;padding:36px 30px 28px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.auth-logo-icon{width:44px;height:44px;background:linear-gradient(145deg,#5eead4,#0f766e);border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#042f2e;box-shadow:0 8px 24px rgba(45,212,191,.25)}
.auth-logo span{font-size:1.55rem;font-weight:700;letter-spacing:-.03em}
.auth-sub{text-align:center;color:var(--muted);font-size:.92rem;margin-bottom:26px}
.auth-tabs{display:flex;background:rgba(0,0,0,.28);border-radius:14px;padding:4px;margin-bottom:22px;border:1px solid var(--border)}
.auth-tabs button{flex:1;background:none;border:0;color:var(--muted);font:600 14px inherit;padding:10px;border-radius:11px;cursor:pointer}
.auth-tabs button.on{background:linear-gradient(180deg,#2dd4bf,#0f766e);color:#042f2e}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;color:var(--muted);font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.auth-field input,.auth-field select,textarea,.search-bar,.bar input{
  width:100%;background:#07141b;border:1px solid var(--border);border-radius:12px;color:var(--fg);padding:12px 14px;font:inherit;font-size:16px}
.auth-field input:focus,.auth-field select:focus,textarea:focus,.search-bar:focus,.bar input:focus{outline:none;border-color:#2dd4bf;box-shadow:0 0 0 3px rgba(45,212,191,.15)}
.pw-wrap{position:relative}.pw-wrap input{padding-right:64px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--p);cursor:pointer;font-size:13px;font-weight:700;padding:8px}
.auth-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.auth-btn,.btn{background:linear-gradient(180deg,#2dd4bf,#0f766e);color:#042f2e;border:0;border-radius:12px;padding:13px 18px;font:700 15px inherit;cursor:pointer}
.auth-btn{width:100%;margin-top:6px}
.auth-btn:hover,.btn:hover{filter:brightness(1.06)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-btn.o,.btn.o{background:transparent;border:1px solid var(--border);color:var(--fg);font-weight:600}
.btn.s{padding:8px 12px;font-size:.82rem;border-radius:10px}
.btn.d{background:var(--bad-bg);color:var(--bad)}
.btn.ok{background:var(--ok-bg);color:var(--ok)}
.auth-error,.auth-success{border-radius:12px;padding:11px 14px;font-size:.85rem;margin-bottom:14px;display:none}
.auth-error{background:var(--bad-bg);border:1px solid rgba(251,113,133,.3);color:#fecdd3}.auth-error.show{display:block}
.auth-success{background:var(--ok-bg);border:1px solid rgba(52,211,153,.3);color:#a7f3d0}.auth-success.show{display:block}
.pw-strength{height:4px;background:#12303a;border-radius:99px;margin-top:8px;overflow:hidden}
.pw-strength-bar{height:100%;width:0;border-radius:99px;transition:width .3s,background .3s}
.pw-hint{font-size:.75rem;color:var(--muted-2);margin-top:6px}
.auth-links{text-align:right;margin:-4px 0 10px}
.auth-links button.link{background:none;border:0;color:var(--p);font:600 13px inherit;cursor:pointer}
.real-badge{text-align:center;font-size:.75rem;color:#99f6e4;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.app{display:none;min-height:100vh;min-height:100dvh}.app.show{display:flex}
.side{width:272px;background:linear-gradient(180deg,#07151c,#061016);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;flex-shrink:0}
.logo{font-size:1.25rem;font-weight:750;letter-spacing:-.03em;padding:6px 12px 18px;display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;background:linear-gradient(145deg,#5eead4,#0f766e);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#042f2e;font-weight:800}
.user-info{background:var(--card-2);border:1px solid var(--border);border-radius:16px;padding:12px;margin:0 4px 16px;font-size:.85rem;display:flex;align-items:center;gap:12px}
.user-info .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#2dd4bf,#0f766e);display:flex;align-items:center;justify-content:center;font-weight:700;color:#042f2e;flex-shrink:0;overflow:hidden}
.user-info .av img,.profile-photo{object-fit:cover}
.user-info .av img{width:100%;height:100%}
.user-info .name{font-weight:700}
.nav{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;color:var(--muted);background:none;border:0;font:600 13.5px inherit;text-align:left;cursor:pointer;width:100%}
.nav:hover{background:rgba(45,212,191,.08);color:#fff}
.nav.on{background:linear-gradient(180deg,rgba(45,212,191,.2),rgba(15,118,110,.28));color:#ecfeff;box-shadow:inset 0 0 0 1px rgba(45,212,191,.25)}
.nav .badge{margin-left:auto;background:#f59e0b;color:#1c1917;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px}
.logout-btn{margin-top:auto;padding:12px 14px;border-radius:12px;background:none;border:1px solid var(--border);color:var(--muted);font:600 13px inherit;cursor:pointer;text-align:left}
.logout-btn:hover{background:var(--bad-bg);color:#fecdd3;border-color:transparent}
.main{flex:1;padding:36px 42px 48px;min-width:0;max-width:1180px}
h1{font-size:1.85rem;font-weight:750;letter-spacing:-.03em;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 22px;max-width:640px}
.card{background:linear-gradient(180deg,rgba(18,38,50,.85),rgba(10,24,32,.9));border:1px solid var(--border);border-radius:18px;padding:18px 18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.stats .card{margin:0}
.stat .l{color:var(--muted);font-size:.72rem;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat .v{font-size:1.7rem;font-weight:750;letter-spacing:-.03em;color:#ccfbf1}
.pill,.badge-role{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.pill{background:#16313a;color:var(--muted)}
.pill.ok,.badge-role.verified{background:var(--ok-bg);color:#6ee7b7}
.pill.warn,.badge-role.pending{background:var(--warn-bg);color:#fde68a}
.pill.bad{background:var(--bad-bg);color:#fecdd3}
.badge-role.admin{background:rgba(251,146,60,.16);color:#fdba74}
.badge-role.official{background:rgba(129,140,248,.16);color:#c7d2fe}
.badge-role.member{background:#16313a;color:var(--muted)}
.profile-photo{width:96px;height:96px;border-radius:50%;border:3px solid rgba(45,212,191,.35);margin-bottom:12px}
.profile-photo-ph{width:96px;height:96px;border-radius:50%;background:linear-gradient(145deg,#2dd4bf,#0f766e);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#042f2e;margin-bottom:12px}
.photo-btn{display:inline-block;cursor:pointer;color:var(--p);font-size:.85rem;font-weight:700;margin-bottom:14px}
.photo-btn input{display:none}
.post-title{font-weight:700;font-size:1.08rem;letter-spacing:-.02em;margin-bottom:8px}
.post-meta,.comment .who,.chat-msg .who{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.post-meta{margin-bottom:12px}
.post-body{color:#e7f5f2;line-height:1.65;margin-bottom:14px;white-space:pre-wrap}
.post-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.comment{background:#07141b;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:10px 0}
.bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.bar input,.search-bar{margin:0;flex:1;min-width:140px}
.search-bar{max-width:420px;margin-bottom:0}
.priv{display:flex;gap:12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.22);border-radius:16px;padding:14px 16px;font-size:.84rem;color:#fde68a;margin-top:28px}
.toast{position:fixed;bottom:24px;right:24px;background:#0e1c24;border:1px solid rgba(45,212,191,.35);border-radius:14px;padding:14px 18px;font-size:.9rem;font-weight:650;box-shadow:var(--shadow);z-index:1000;max-width:360px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:640px}
th,td{padding:12px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
tr:hover td{background:rgba(45,212,191,.04)}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.chat-box{max-height:420px;overflow-y:auto;margin-bottom:12px}
.chat-msg{padding:10px 14px;background:#07141b;border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.vis-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.vis-row label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.9rem;margin:0}
.pending-banner{background:var(--warn-bg);border:1px solid rgba(251,191,36,.28);color:#fde68a;border-radius:16px;padding:14px 16px;margin-bottom:16px;font-size:.9rem}
@media(max-width:900px){.main{padding:28px 22px}.side{width:230px}}
@media(max-width:768px){
  .auth-screen{align-items:flex-start;padding-top:max(20px,env(safe-area-inset-top))}
  .auth-box{padding:26px 18px;border-radius:20px}
  .auth-row{grid-template-columns:1fr}
  .app.show{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;top:0;z-index:40;flex-direction:row;flex-wrap:nowrap;align-items:center;padding:10px 10px;padding-top:max(10px,env(safe-area-inset-top));gap:6px;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto}
  .logo,.user-info{display:none}
  .nav{width:auto;flex-shrink:0;white-space:nowrap;padding:9px 12px;border-radius:99px}
  .logout-btn{display:block;margin:0 0 0 auto;flex-shrink:0;padding:9px 12px;white-space:nowrap;border-radius:99px}
  .main{padding:18px 14px 32px;max-width:100%}
  h1{font-size:1.4rem}
  .stats{grid-template-columns:1fr 1fr}
  .bar{flex-direction:column;align-items:stretch}
  .bar input,.bar button,.search-bar{width:100%;max-width:none}
  .toast{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:none}
  .chat-grid{grid-template-columns:1fr !important}
}
@media(max-width:400px){.stats{grid-template-columns:1fr}}
@media(min-width:1200px){.main{padding:44px 56px}}

.logo{align-items:center}
.logo-kicker{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5eead4;margin-top:1px}
.side.is-admin{border-right-color:rgba(251,191,36,.28)}
.side.is-admin .logo-kicker{color:#fbbf24}
.nav-sec{margin:14px 12px 6px;font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6f8b84}
.admin-top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(90deg,rgba(251,191,36,.14),rgba(45,212,191,.08));border:1px solid rgba(251,191,36,.28);border-radius:16px;padding:14px 16px;margin-bottom:18px}
.admin-top b{display:block;font-size:1rem}
.admin-top span{color:var(--muted);font-size:.82rem}
@media(max-width:768px){.nav-sec{display:none}.admin-top{align-items:flex-start}.admin-top span{display:block}}
</style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="auth-logo"><div class="auth-logo-icon">A</div><span>Alaric</span></div>
    <p class="auth-sub">Health provider community</p>
    <div class="auth-tabs" id="authTabs">
      <button class="on" data-tab="login">Login</button>
      <button data-tab="signup">Create Account</button>
    </div>
    <div class="auth-error" id="authError"></div>
    <div class="auth-success" id="authSuccess"></div>
    <div id="loginForm">
      <div class="auth-field"><label>Email</label><input type="email" id="loginId" placeholder="you@example.com" autocomplete="email"></div>
      <div class="auth-field"><label>Password</label>
        <div class="pw-wrap"><input type="password" id="loginPw" placeholder="Enter password" autocomplete="current-password"><button type="button" class="pw-toggle" data-target="loginPw">Show</button></div>
      </div>
      <div class="auth-links"><button type="button" class="link" id="forgotLink">Forgot password?</button></div>
      <button class="auth-btn" id="loginBtn">Login</button>
    </div>
    <div id="forgotForm" style="display:none">
      <p class="auth-sub" style="margin-bottom:16px;text-align:left">Enter your account email for a reset link.</p>
      <div class="auth-field"><label>Email</label><input type="email" id="fpId" placeholder="you@example.com"></div>
      <button class="auth-btn" id="resetBtn">Send Reset Link</button>
      <button class="auth-btn o" id="backToLogin">Back to Login</button>
    </div>
    <div id="signupForm" style="display:none">
      <div class="auth-row">
        <div class="auth-field"><label>First Name</label><input type="text" id="suFirst" placeholder="First name"></div>
        <div class="auth-field"><label>Last Name</label><input type="text" id="suLast" placeholder="Last name"></div>
      </div>
      <div class="auth-field"><label>Email</label><input type="email" id="suId" placeholder="you@example.com" autocomplete="email"></div>
      <div class="auth-field"><label>Password</label>
        <div class="pw-wrap"><input type="password" id="suPw" placeholder="Strong password" autocomplete="new-password"><button type="button" class="pw-toggle" data-target="suPw">Show</button></div>
        <div class="pw-strength"><div class="pw-strength-bar" id="pwBar"></div></div>
        <div class="pw-hint" id="pwHint">Min 8 chars, number &amp; symbol</div>
      </div>
      <div class="auth-field"><label>Medical Specialty</label>
        <select id="suSpec">
          <option value="">Select specialty</option>
          <option>Cardiology</option><option>Internal Medicine</option><option>Mental Health / Psychiatry</option>
          <option>Family Medicine</option><option>Emergency Medicine</option><option>Pediatrics</option>
          <option>Dermatology</option><option>Orthopedic Surgery</option><option>Neurology</option>
          <option>Obstetrics and Gynecology</option><option>Oncology</option><option>Radiology</option>
          <option>Anesthesiology</option><option>General Surgery</option><option>Medical Coding / Billing</option><option>Other</option>
        </select>
      </div>
      <button class="auth-btn" id="signupBtn">Create Account</button>
    </div>
    <div class="real-badge">Alaric Health Services</div>
  </div>
</div>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main class="main"><div id="c"></div>
    <div class="priv"><span>🔒</span><div><b>Privacy.</b> Members see member questions only. Emails and admin tools stay with admins.</div></div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
